name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/check.mjs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s examples -p 'test_*.py' -v
